[project]
name = "stormguard-homeassistant"
version = "0.1.0"
description = "StormGuard Home Assistant integration and blueprints"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources.*"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "S"]
# RUF001-003: Turkish text (ı, ş, ğ) is intentional.
ignore = ["PLR2004", "PLR0913", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.stormguard"]
combine-as-imports = true
